[phases.setup]
aptPkgs = ['python3', 'make', 'g++']

[phases.install]
cmds = ['cd ai-content-studio-saas-main && npm install']

[phases.build]
cmds = ['echo "Skipping client build; using tracked ai-content-studio-saas-main/client/dist"']
dependsOn = ['install']

[variables]
NODE_ENV = 'production'
HOST = '0.0.0.0'

[start]
cmd = 'node ai-content-studio-saas-main/server/index.js'

