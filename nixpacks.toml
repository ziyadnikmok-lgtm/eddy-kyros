[phases.install]
cmds = ['cd ai-content-studio-saas-main && npm install', 'cd ai-content-studio-saas-main/client && npm install']

[phases.build]
cmds = ['cd ai-content-studio-saas-main/client && npm run build']
dependsOn = ['install']

[variables]
NODE_ENV = 'production'
HOST = '0.0.0.0'

[start]
cmd = 'node ai-content-studio-saas-main/server/index.js'
