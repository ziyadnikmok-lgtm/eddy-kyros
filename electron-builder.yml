appId: com.aistudio.app
productName: AI Content Studio
directories:
  output: "C:/Users/X/Pictures/xaxa/aistudclean"
files:
  - server/**/*
  - "!server/data/**/*"
  - electron/**/*
  - client/dist/**/*
  - package.json
extraResources:
  - from: server/data/styleLibrary.json
    to: seed-data/styleLibrary.json
  - from: server/data/contentTypePresets.json
    to: seed-data/contentTypePresets.json
  - from: server/data/niches.json
    to: seed-data/niches.json
  - from: server/data/promptKnowledge.json
    to: seed-data/promptKnowledge.json
  - from: build/seed-data
    to: seed-data
  - from: build/.env
    to: .env
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  target:
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
portable:
  artifactName: "${productName} ${version}.exe"
