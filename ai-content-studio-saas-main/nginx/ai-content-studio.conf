# Nginx reverse proxy for AI Content Studio
# Domain: ai-content-studio.216.246.104.87.nip.io
# Backend: localhost:3001

server {
    listen 80;
    server_name ai-content-studio.216.246.104.87.nip.io studio.216.246.104.87.nip.io 216.246.104.87;

    # Increase timeouts for long AI generation requests
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;

    # Large body size for image/video uploads
    client_max_body_size 210m;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket / SSE support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streams
        proxy_buffering       off;
        proxy_cache           off;
    }
}
