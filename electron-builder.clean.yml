appId: com.aistudio.app
productName: AI Content Studio
directories:
  output: C:/Users/X/Pictures/xaxa/aistudclean

files:
  - server/**/*
  - electron/**/*
  - client/dist/**/*
  - package.json
  - node_modules/**/*

extraResources:
  # Clean seed data — empty templates only, no personal data
  - from: scripts/seed-data/
    to: seed-data/
    filter:
      - "**/*"
  - from: .env.example
    to: .env

win:
  target: portable
  signAndEditExecutable: false

asar: true
