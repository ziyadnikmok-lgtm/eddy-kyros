appId: com.aistudio.personal
productName: AI Content Studio
directories:
  output: dist-electron

files:
  - server/**/*
  - electron/**/*
  - client/dist/**/*
  - package.json
  - node_modules/**/*

extraResources:
  # Personal data — bundled into resources/seed-data/ etc.
  - from: server/data/
    to: seed-data/
    filter:
      - "**/*"
  - from: characters/
    to: seed-characters/
    filter:
      - "**/*"
  - from: uploads/generated/
    to: seed-gallery/
    filter:
      - "**/*"
  - from: data/
    to: seed-batch/
    filter:
      - "**/*"
  - from: .env
    to: .env

win:
  target: portable
  signAndEditExecutable: false

asar: true
