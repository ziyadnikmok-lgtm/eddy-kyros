<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mission Control</title>
  <style>
    :root{
      --bg:#070b16;--panel:#0f1b36;--panel2:#12254a;--line:#2c4a7c;--txt:#e9f1ff;--mut:#9db5df;
      --red:#ff4d5a;--blue:#67a1ff;--green:#34d399;--amber:#f7b955;
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--txt)}
    .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
    .side{border-right:1px solid #1f3359;background:#0b1327;padding:14px;position:sticky;top:0;height:100vh}
    .brand{font-weight:800;font-size:1.1rem;margin-bottom:12px}
    .nav button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#dce8ff;padding:10px;border-radius:10px;margin-bottom:6px;cursor:pointer}
    .nav button.active,.nav button:hover{background:#152a54;border-color:#31558f}
    .main{padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .chip{padding:7px 10px;border:1px solid #355d98;border-radius:999px;background:#132951;color:#d6e5ff;font-size:.83rem}
    .tabs{display:none}.tabs.active{display:block}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .card{background:linear-gradient(180deg,#ffffff08,#ffffff03),var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
    .k{color:var(--mut);font-size:.82rem}.v{font-size:1.3rem;font-weight:750}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .full{grid-column:1/-1}
    input,textarea,select{width:100%;background:#0b1733;border:1px solid #325690;color:var(--txt);border-radius:10px;padding:10px}
    textarea{min-height:150px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    button.btn{border:0;border-radius:10px;padding:9px 12px;color:#fff;background:linear-gradient(180deg,#84b5ff,var(--blue));font-weight:650;cursor:pointer}
    .btn.sec{background:#274673}.btn.ok{background:linear-gradient(180deg,#51e5b2,var(--green));color:#062a1d}.btn.danger{background:linear-gradient(180deg,#ff8d98,var(--red))}

    .office-wrap{background:#09162f;border:1px solid var(--line);border-radius:14px;padding:12px}
    .office{position:relative;height:440px;border-radius:12px;border:2px solid #6f4c33;
      background:
      linear-gradient(90deg,#0000 48%,#0002 50%,#0000 52%),
      linear-gradient(#0000 48%,#0002 50%,#0000 52%),
      radial-gradient(circle at 20% 20%,#ffffff12,transparent 30%),
      #7f6a61;
      background-size:60px 60px,60px 60px,auto,auto;
      overflow:hidden}
    .desk{position:absolute;width:140px;height:80px;background:#5b3e2a;border:2px solid #3e2a1c;border-radius:8px}
    .agent{position:absolute;width:110px;padding:6px 8px;background:#132951e8;border:1px solid #365f9e;border-radius:10px;font-size:.78rem;transition:all .8s ease}
    .agent .n{font-weight:700}.agent .s{color:#b9ceef}.online{box-shadow:0 0 0 2px #34d39955}.busy,.working{box-shadow:0 0 0 2px #f7b95566}.idle{opacity:.9}

    table{width:100%;border-collapse:collapse} th,td{padding:9px 8px;border-bottom:1px solid #2a4776;text-align:left;vertical-align:top}
    td small{word-break:break-all;color:#c5d8ff}.pill{padding:3px 8px;border-radius:999px;font-size:.76rem;font-weight:700}
    .pill.done{background:#34d39922;color:#9ef8da;border:1px solid #34d39955}.pill.queued{background:#f7b95522;color:#ffdca8;border:1px solid #f7b95555}.pill.error{background:#ff4d5a22;color:#ffb6be;border:1px solid #ff4d5a55}

    .toast{position:fixed;right:14px;bottom:14px;background:#11254a;border:1px solid #3762a1;border-radius:12px;padding:10px 12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1050px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">🎮 Mission Control</div>
      <div class="nav">
        <button class="active" data-tab="overview">Dashboard</button>
        <button data-tab="office">Agents Office</button>
        <button data-tab="xops">X Operations</button>
        <button data-tab="settings">Settings</button>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <h2 style="margin:0">Tenacitas-style Control Room</h2>
        <div id="healthBadge" class="chip">● System ready</div>
      </div>

      <section id="overview" class="tabs active">
        <div class="cards">
          <div class="card"><div class="k">Images</div><div id="kpiImages" class="v">0</div></div>
          <div class="card"><div class="k">Queue</div><div id="kpiQueue" class="v">0</div></div>
          <div class="card"><div class="k">Completed</div><div id="kpiDone" class="v">0</div></div>
          <div class="card"><div class="k">Viral Session</div><div id="kpiViral" class="v">Idle</div></div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px">Live Crew Summary</h3>
          <div id="crewSummary" style="color:var(--mut)">Loading…</div>
        </div>
      </section>

      <section id="office" class="tabs">
        <div class="office-wrap">
          <h3 style="margin:0 0 8px">🕹️ Agents Office (fun mode)</h3>
          <div class="office" id="officeStage">
            <div class="desk" style="left:60px;top:70px"></div>
            <div class="desk" style="left:280px;top:70px"></div>
            <div class="desk" style="left:500px;top:70px"></div>
            <div class="desk" style="left:170px;top:250px"></div>
            <div class="desk" style="left:420px;top:250px"></div>
          </div>
        </div>
      </section>

      <section id="xops" class="tabs">
        <div class="grid">
          <div class="card">
            <h3 style="margin:0 0 8px">Add Post URL (Queue + Trigger)</h3>
            <input id="url" placeholder="https://x.com/user/status/..."/>
            <div style="height:8px"></div>
            <label style="color:var(--mut);font-size:.85rem">Optional image</label>
            <select id="imgSelect"></select>
            <div class="row"><button id="replyBtn" class="btn ok" onclick="replyNow(this)">Queue + trigger now</button></div>
          </div>
          <div class="card">
            <h3 style="margin:0 0 8px">Upload Images</h3>
            <input id="files" type="file" accept="image/*" multiple />
            <div class="row"><button class="btn" onclick="upload()">Upload</button><button class="btn sec" onclick="loadImages()">Refresh</button></div>
            <div id="imgCount" style="color:var(--mut);margin-top:6px">0 images available</div>
          </div>

          <div class="card full">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px">
              <h3 style="margin:0">Queue</h3>
              <input id="queueSearch" placeholder="Filter url/status" oninput="renderQueue()" style="max-width:280px" />
            </div>
            <table><thead><tr><th>Status</th><th>Post</th><th>Reply</th><th>Action</th></tr></thead><tbody id="queueBody"></tbody></table>
          </div>

          <div class="card full">
            <h3 style="margin:0 0 8px">Viral Session</h3>
            <div class="row"><button id="viralBtn" class="btn" onclick="startViral(this)">Start 2h viral session</button><span id="viralState" style="color:var(--mut)"></span></div>
          </div>
        </div>
      </section>

      <section id="settings" class="tabs">
        <div class="card">
          <h3 style="margin:0 0 8px">Config JSON</h3>
          <textarea id="cfg"></textarea>
          <div class="row"><button class="btn" onclick="saveCfgCmd()">Copy save command</button></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let queueItems=[], crew=[], agentsMap=new Map();
    const stage = document.getElementById('officeStage');

    document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      document.querySelectorAll('.tabs').forEach(t=>t.classList.remove('active')); document.getElementById(b.dataset.tab).classList.add('active');
    });

    async function j(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok) throw new Error(d.error||('HTTP '+r.status));return d}
    function toast(m,e=false){const t=document.getElementById('toast');t.textContent=m;t.style.borderColor=e?'#a94352':'#3762a1';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
    function setBusy(btn,on,a,b){btn.disabled=on;btn.textContent=on?a:b}

    function statusPill(s){s=(s||'queued').toLowerCase();return `<span class="pill ${s==='done'?'done':(s==='error'?'error':'queued')}">${s}</span>`}
    function updateKPIs(){const total=queueItems.length,done=queueItems.filter(x=>(x.status||'').toLowerCase()==='done').length;document.getElementById('kpiQueue').textContent=total;document.getElementById('kpiDone').textContent=done}

    function renderQueue(){const t=document.getElementById('queueSearch').value.trim().toLowerCase();const q=[...queueItems].reverse().filter(i=>!t||((i.url||'')+' '+(i.status||'')).toLowerCase().includes(t));
      const b=document.getElementById('queueBody');
      if(!q.length){b.innerHTML='<tr><td colspan="4">No queue items</td></tr>';return}
      b.innerHTML=q.map(i=>`<tr><td>${statusPill(i.status)}</td><td><small>${i.url||''}</small></td><td>${i.replyUrl?`<a target="_blank" href="${i.replyUrl}">Open</a>`:'-'}</td><td><button class="btn danger" onclick='delQ(${JSON.stringify(i.id||"")},${JSON.stringify(i.url||"")})'>Delete</button></td></tr>`).join('')
    }

    async function loadQueue(){try{const d=await j('/api/list-queue');queueItems=d.items||[];updateKPIs();renderQueue()}catch(e){toast('Queue load failed: '+e.message,true)}}
    async function delQ(id,url){try{const d=await j('/api/delete-queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,url})}); if(!d.removed)return toast('Nothing deleted',true); toast('Deleted');loadQueue()}catch(e){toast('Delete failed: '+e.message,true)}}

    async function loadImages(){try{const d=await j('/api/list-images');const f=d.files||[];document.getElementById('imgCount').textContent=`${f.length} images available`;document.getElementById('kpiImages').textContent=f.length;document.getElementById('imgSelect').innerHTML='<option value="">Auto-pick image</option>'+f.map(x=>`<option>${x.name}</option>`).join('')}catch(e){toast('Image load failed',true)}}
    async function upload(){const fs=[...document.getElementById('files').files];if(!fs.length)return toast('Choose images first',true); const toData=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      const p={files:[]}; for(const f of fs)p.files.push({name:f.name,data:await toData(f)});
      try{const o=await j('/api/upload-images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});toast(`Uploaded ${o.uploaded?.length||0} image(s)`);loadImages()}catch(e){toast('Upload failed: '+e.message,true)}
    }

    async function replyNow(btn){const u=document.getElementById('url').value.trim();if(!u)return toast('Paste URL first',true);const image=document.getElementById('imgSelect').value||'';setBusy(btn,true,'Queueing...','Queue + trigger now');
      try{await j('/api/reply-now',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,image})});document.getElementById('url').value='';toast('Queued ✅');loadQueue();loadOpsHub()}catch(e){toast('Queue failed: '+e.message,true)}finally{setBusy(btn,false,'Queueing...','Queue + trigger now')}}

    async function loadViral(){try{const d=await j('/api/viral-state');const a=!!(d.state&&d.state.jobId);document.getElementById('kpiViral').textContent=a?'Active':'Idle';document.getElementById('viralState').textContent=a?('Active job: '+d.state.jobId):'No active session';document.getElementById('healthBadge').textContent=a?'● Viral session active':'● System ready'}catch(e){}}
    async function startViral(btn){setBusy(btn,true,'Starting...','Start 2h viral session');try{const d=await j('/api/start-viral-session',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});toast('Viral started');document.getElementById('viralState').textContent='Active job: '+d.jobId;loadViral();loadOpsHub()}catch(e){toast('Viral failed: '+e.message,true)}finally{setBusy(btn,false,'Starting...','Start 2h viral session')}}

    function moveAgent(el,idx){const w=stage.clientWidth-130,h=stage.clientHeight-90;const pos=[[90,85],[300,85],[520,85],[200,280],[450,280]];const p=pos[idx%pos.length];const x=Math.max(8,Math.min(w,p[0]+Math.floor((Math.random()*26)-13)));const y=Math.max(8,Math.min(h,p[1]+Math.floor((Math.random()*20)-10)));el.style.transform=`translate(${x}px,${y}px)`}
    function renderOffice(){crew.forEach((a,i)=>{let el=agentsMap.get(a.name);if(!el){el=document.createElement('div');stage.appendChild(el);agentsMap.set(a.name,el)}el.className='agent '+(a.status||'idle');el.innerHTML=`<div class='n'>${a.emoji||'🤖'} ${a.name}</div><div class='s'>${a.role||''}</div><div>${a.task||''}</div>`;moveAgent(el,i)})}

    async function loadOpsHub(){try{const d=await j('/api/ops-hub');crew=d.crew||[];renderOffice();document.getElementById('crewSummary').textContent=`${d.summary?.queued||0} queued · ${d.summary?.done||0} done · last: ${(d.summary?.lastAttempt?.status)||'n/a'}`}catch(e){toast('Ops hub failed: '+e.message,true)}}

    function saveCfgCmd(){const t=document.getElementById('cfg').value;const cmd=`cat > /Users/admin/.openclaw/workspace/social-reply-config.json <<'JSON'\n${t}\nJSON`;navigator.clipboard.writeText(cmd);toast('Save command copied')}

    async function init(){try{document.getElementById('cfg').value=await (await fetch('social-reply-config.json')).text()}catch{document.getElementById('cfg').value='{}'}
      await Promise.all([loadImages(),loadQueue(),loadViral(),loadOpsHub()]);
      setInterval(loadQueue,10000);setInterval(loadOpsHub,9000);setInterval(loadViral,15000)
    }
    init();
  </script>
</body>
</html>
