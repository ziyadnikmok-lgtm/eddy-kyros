version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-content-studio
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ai_studio_data:/data
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - DOTENV_CONFIG_PATH=/data/.env
      # These can be overridden by /data/.env at runtime
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ai_studio_data:
    driver: local
