<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agentverse Live</title>
  <style>
    body{margin:0;font-family:Inter,system-ui;background:#070b16;color:#eaf1ff}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    h1{margin:0 0 6px;font-size:1.5rem}
    .mut{color:#9eb5de}
    .stage{margin-top:14px;height:420px;border:1px solid #2b4473;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 20%,#1a2a4f66,transparent 40%),#0b1430}
    .agent{position:absolute;width:170px;padding:10px;border-radius:14px;border:1px solid #35578f;background:#102247dd;transition:all .8s ease;box-shadow:0 8px 24px #0006}
    .name{font-weight:700}.role{font-size:.82rem;color:#9eb5de}.task{font-size:.82rem;margin-top:6px;word-break:break-word}
    .online{border-color:#37d9a2}.busy,.working{border-color:#f2b75d}.idle{border-color:#6f8fbd}.active{border-color:#37d9a2}
    .logs{margin-top:12px;display:grid;gap:8px}
    .log{border:1px solid #2d4777;border-radius:10px;padding:8px;background:#0f1e3f}
    .top{display:flex;justify-content:space-between;align-items:end;gap:10px}
    a{color:#9ec3ff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>🎬 Agentverse Live</h1>
        <div class="mut">Watch the crew move around, chill, and work together in real-time.</div>
      </div>
      <div><a href="/dashboard.html">Back to main dashboard</a></div>
    </div>

    <div id="stage" class="stage"></div>

    <div class="logs" id="logs"></div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const logs = document.getElementById('logs');
    const nodes = new Map();

    function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

    function makeCard(a){
      const el=document.createElement('div');
      el.className='agent '+(a.status||'idle');
      el.innerHTML=`<div class="name">${a.emoji||'🤖'} ${a.name}</div><div class="role">${a.role||''}</div><div class="task">${a.task||''}</div>`;
      stage.appendChild(el); return el;
    }

    function move(el, idx){
      const w=stage.clientWidth-190, h=stage.clientHeight-100;
      const cols=2, row=Math.floor(idx/cols), col=idx%cols;
      const baseX = 30 + col*(w/2), baseY = 35 + row*(h/2);
      const x = Math.max(10, Math.min(w, baseX + rand(-40,40)));
      const y = Math.max(10, Math.min(h, baseY + rand(-35,35)));
      el.style.transform=`translate(${x}px,${y}px)`;
    }

    function addLog(t){
      const el=document.createElement('div');
      el.className='log';
      el.textContent=new Date().toLocaleTimeString()+" — "+t;
      logs.prepend(el);
      while(logs.children.length>6) logs.removeChild(logs.lastChild);
    }

    async function tick(){
      try{
        const res=await fetch('/api/ops-hub');
        const data=await res.json();
        const crew=data.crew||[];
        crew.forEach((a,i)=>{
          let el=nodes.get(a.name);
          if(!el){el=makeCard(a); nodes.set(a.name,el); addLog(`${a.name} joined the room.`)}
          el.className='agent '+(a.status||'idle');
          el.innerHTML=`<div class="name">${a.emoji||'🤖'} ${a.name}</div><div class="role">${a.role||''}</div><div class="task">${a.task||''}</div>`;
          move(el,i);
        });
        addLog(`Queue: ${data.summary?.queued||0} pending, ${data.summary?.done||0} done.`);
      }catch(e){addLog('Connection hiccup: '+e.message)}
    }

    tick();
    setInterval(tick,7000);
  </script>
</body>
</html>
